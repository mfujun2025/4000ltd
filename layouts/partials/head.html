<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Params.siteName }}{{ end }}</title>
  {{- $desc := .Description | default .Site.Params.description }}
  <meta name="description" content="{{ $desc }}">
  {{- with .Params.keywords }}<meta name="keywords" content="{{ . }}">{{ end }}
  <meta name="author" content="{{ .Site.Params.siteName }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="stylesheet" href="/css/style.css">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ $desc }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
</head>
<body>
{{ partial "header.html" . }}
